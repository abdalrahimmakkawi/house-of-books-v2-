<!doctype html>
<html lang="en">
  <head>

    <!-- SEO & Social -->
    <title>House of Books — AI-Powered Reading</title>
    <meta name="description" content="304 timeless books, distilled by AI. Instant summaries, deep conversations, 5 languages. Start reading smarter today." />
    <meta name="keywords" content="books, AI, summaries, reading, blinkist alternative, book summaries" />

    <meta property="og:image" content="https://house-of-books-v2.vercel.app/wallpaper/classic.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="House of Books — AI-Powered Reading" />
    <meta name="twitter:description" content="304 timeless books, distilled by AI." />
    <meta name="twitter:image" content="https://house-of-books-v2.vercel.app/wallpaper/classic.jpg" />

    <!-- MS Tile -->
    <meta name="msapplication-TileColor" content="#06050a" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Vercel Web Analytics (page views; custom events used elsewhere via window.va) -->
    <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
    <script defer src="/_vercel/insights/script.js"></script>

    <!-- Service worker: precache hashed assets + runtime cache HTML/media/covers.
         The SW is built by vite-plugin-pwa into /sw.js. It uses skipWaiting +
         clientsClaim so a new deploy's worker takes control immediately, and
         HTML is served by a NetworkFirst runtime route so a cold open always
         fetches the newest index.html — which already points at the newest
         hashed JS. So the app self-updates on open with NO page reload.

         HISTORY — the comment here used to credit `navigateFallback: null` for
         that, and it was wrong. navigateFallback only controls the
         NavigationRoute; `html` was still in workbox.globPatterns, so
         index.html was precached and Workbox's PrecacheRoute served `/` from
         Cache Storage via its default directoryIndex. Navigations never hit the
         network (measured: GET `/` => transferSize 0, deliveryType
         "cache-storage"). That is what pinned installed apps to an old build
         until the user uninstalled/reinstalled. The real fix is keeping HTML
         out of the precache — see the design note in vite.config.ts.

         There is deliberately NO controllerchange->reload() handler here.
         That handler caused an infinite reload loop that bricked installed
         apps (stuck on the splash logo forever): clientsClaim fires
         controllerchange, the handler reloads, and its in-page "already
         reloading" guard resets on every reload, so it could never break the
         cycle. Because HTML is network-first, dropping the reload loses
         nothing on a normal open. Do NOT re-add a reload-on-update here
         without a guard that survives across reloads (e.g. sessionStorage)
         AND that ignores the first-load claim on an uncontrolled page. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            // Drive the update check ourselves. vite-plugin-pwa's
            // registerType:'autoUpdate' only works through the registration
            // snippet it injects, and injectRegister is false here — so nothing
            // was ever calling reg.update(). That left Chrome's own sw.js check
            // (which only runs on navigation) as the sole update trigger, and a
            // TWA resumed from the background may not navigate for days, pinning
            // the worker to an old build.
            //
            // No reload handling is needed alongside this: HTML is NetworkFirst,
            // so the next open picks up the new build by itself. Do NOT add a
            // controllerchange -> reload() here (see the warning below).
            var lastCheck = 0
            var check = function () {
              if (document.visibilityState !== 'visible') return
              var now = Date.now()
              if (now - lastCheck < 60 * 60 * 1000) return // at most hourly
              lastCheck = now
              reg.update().catch(function () {})
            }
            // visibilitychange is the one that matters for an installed app
            // being resumed from the background.
            document.addEventListener('visibilitychange', check)
            setInterval(check, 60 * 60 * 1000)
            check()
          }).catch(function (err) {
            console.warn('[HoB] SW registration failed', err)
          })
        })
      }

      // Splash watchdog / self-heal. Root cause of the "stuck on the logo
      // forever" brick was the reload loop removed above; this is a safety net
      // so no *future* bad cache state can permanently trap a user (which
      // otherwise forces an uninstall/reinstall). If the JS bundle hasn't
      // booted (main.tsx sets window.__hobBooted) a while after load AND a
      // service worker is in control, we assume a stale/broken cache: clear
      // all caches, unregister the worker, and reload ONCE. Guarded by
      // sessionStorage so it can fire at most once per session and can never
      // itself loop.
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window.__hobBooted) return
          if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return
          if (sessionStorage.getItem('hob-recovered')) return
          sessionStorage.setItem('hob-recovered', '1')
          console.warn('[HoB] app did not boot — clearing caches and recovering')
          var done = function () { window.location.reload() }
          Promise.resolve()
            .then(function () {
              return window.caches
                ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k) })) })
                : null
            })
            .then(function () {
              return navigator.serviceWorker.getRegistrations()
                .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister() })) })
            })
            .then(done, done)
        }, 12000)
      })

      // PWA Install prompt — save for later use
      let deferredPrompt = null
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault()
        deferredPrompt = e
        // Dispatch custom event so React can show install button
        window.dispatchEvent(new CustomEvent('pwa-installable'))
      })

      window.addEventListener('appinstalled', () => {
        deferredPrompt = null
        console.log('[HoB] PWA installed successfully')
      })

      // Expose install trigger globally for React to call
      window.triggerPWAInstall = async () => {
        if (!deferredPrompt) return false
        deferredPrompt.prompt()
        const { outcome } = await deferredPrompt.userChoice
        deferredPrompt = null
        return outcome === 'accepted'
      }
    </script>
  </body>
</html>
